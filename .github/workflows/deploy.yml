# Production deploy of the API (+ the shared compose / nginx / scripts).
#
#   git tag v1.4.0 && git push origin v1.4.0      → CI → image → VPS deploy
#   Actions → "Deploy API" → Run workflow          → redeploy a ref manually
#
# Required repository/environment secrets (environment: production):
#   VPS_HOST          VPS hostname or IP
#   VPS_USER          deploy user on the VPS (member of the `docker` group)
#   VPS_SSH_KEY       private key for VPS_USER (ed25519, no passphrase)
#   VPS_KNOWN_HOSTS   output of `ssh-keyscan -t ed25519 <VPS_HOST>` (host-key pinning)
# Images go to GHCR with the built-in GITHUB_TOKEN — no registry secret needed.
name: Deploy API

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          # Immutable release tag + commit tag. No `latest` — the VPS deploys
          # explicit tags so every release can be rolled back to by name.
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER }}" > ~/.ssh/config
      - name: Sync deployment files
        # Code-owned files only. Never touches .env, backups/ or deploy/state/.
        run: |
          rsync -az --delete-after --exclude 'state/' deploy/ vps:/opt/bytari/deploy/
          rsync -az docker-compose.production.yml vps:/opt/bytari/docker-compose.production.yml
      - name: Deploy
        run: ssh vps "cd /opt/bytari && deploy/scripts/deploy.sh --api-tag '${{ needs.image.outputs.tag }}'"
      - name: Verify from the internet
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://api.baytari.com/health/ready
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://baytari.com/
