name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bytari
          POSTGRES_PASSWORD: bytari
          POSTGRES_DB: bytari_test
        ports: ['5435:5432']
        options: >-
          --health-cmd "pg_isready -U bytari -d bytari_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    # test/setup.ts falls back to the process env when .env.test is absent.
    env:
      DB_HOST: localhost
      DB_PORT: '5435'
      DB_NAME: bytari_test
      DB_USER: bytari
      DB_PASSWORD: bytari
      DB_SSL: 'false'
      CORS_ORIGINS: '*'
      AI_TOOLKIT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Prettier (changed files)
        # The repo predates enforced formatting; only files touched by this
        # change are checked. Switch to `npm run format:check` after a one-off
        # `npm run format` commit (docs/deployment.md §CI).
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # Tag pushes / manual runs have no base (`before` is all zeros): skip
          # rather than diff against the root commit, which checks every file.
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then echo "no base commit (tag or manual run) — skipped"; exit 0; fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.ts' '*.js' '*.json' '*.yml' '*.yaml' | grep -v '^package-lock.json$' || true)
          if [ -n "$files" ]; then echo "$files" | xargs npx prettier --check; else echo "no formattable changes"; fi
      - name: Test (unit + integration)
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker image · compose · nginx · scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: bytari-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root
        run: test "$(docker run --rm --entrypoint id bytari-api:ci -un)" = node
      - name: Validate docker-compose.production.yml
        run: |
          sed -e 's/=CHANGE_ME$/=ci-placeholder-value-that-is-long-enough-000000/' \
              -e 's/^R2_\(ACCOUNT_ID\|ACCESS_KEY_ID\|SECRET_ACCESS_KEY\|BUCKET\)=$/R2_\1=ci/' \
              deploy/.env.production.example > .env
          chmod 600 .env
          deploy/scripts/check-env.sh .env
          docker compose -f docker-compose.production.yml config --quiet
      - name: nginx -t (edge config)
        run: |
          mkdir -p /tmp/le/live/bytari.com
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=bytari.com \
            -keyout /tmp/le/live/bytari.com/privkey.pem -out /tmp/le/live/bytari.com/fullchain.pem 2>/dev/null
          docker run --rm \
            -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/deploy/nginx/snippets:/etc/nginx/snippets:ro" \
            -v /tmp/le:/etc/letsencrypt:ro \
            nginx:1.27-alpine nginx -t
      - name: ShellCheck deploy scripts
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable -S warning deploy/scripts/*.sh
