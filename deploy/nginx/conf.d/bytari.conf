# Edge proxy for bytari.com (web) and api.bytari.com (API + realtime).
# One Let's Encrypt certificate covers all three names:
#   /etc/letsencrypt/live/bytari.com/{fullchain,privkey}.pem
# (issued by deploy/scripts/init-letsencrypt.sh, renewed by the certbot service).

# Docker's embedded DNS — lets nginx start even before an upstream resolves,
# and re-resolves container IPs after a redeploy.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# `$uri` (path only), never `$request` / `$args`: browsers pass the JWT as
# `?access_token=` on the realtime WebSocket URL — it must not reach the logs.
log_format bytari '$remote_addr - [$time_local] "$host" "$request_method $uri $server_protocol" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" rt=$request_time urt=$upstream_response_time';
# Declared per server block below: a server-level access_log REPLACES the
# stock http-level `main` log (which records the full query string).
error_log  /dev/stderr warn;

server_tokens off;
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# --- :80 — ACME challenge + redirect everything else to HTTPS ----------------
server {
    access_log /dev/stdout bytari;
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- www → apex (canonical host) ---------------------------------------------
server {
    access_log /dev/stdout bytari;
    listen 443 ssl;
    http2 on;
    server_name www.bytari.com;
    include /etc/nginx/snippets/tls.conf;
    return 301 https://bytari.com$request_uri;
}

# --- bytari.com → Expo Web ----------------------------------------------------
server {
    access_log /dev/stdout bytari;
    listen 443 ssl default_server;
    http2 on;
    server_name bytari.com;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 1m;

    location / {
        set $web http://web:8080;
        proxy_pass $web;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- api.bytari.com → Node API (REST + WebSocket) -----------------------------
server {
    access_log /dev/stdout bytari;
    listen 443 ssl;
    http2 on;
    server_name api.bytari.com;
    include /etc/nginx/snippets/tls.conf;
    # Security headers (HSTS, nosniff, …) come from the API itself (helmet).

    # JSON bodies are capped at BODY_LIMIT (1mb) by the app; binaries go
    # straight to R2 via presigned URLs, never through here.
    client_max_body_size 2m;

    # Realtime gateway (plain WebSocket, REALTIME_PATH=/realtime).
    location = /realtime {
        set $api http://api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server pings every 30 s; keep idle sockets well above that.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        set $api http://api:3000;
        proxy_pass $api;
        include /etc/nginx/snippets/proxy.conf;
    }
}
