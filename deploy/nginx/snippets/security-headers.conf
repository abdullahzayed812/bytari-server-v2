# HTTPS only for a year (no `preload` — opt in deliberately once stable).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
# No Content-Security-Policy yet: Expo Web injects inline bootstrap scripts;
# a CSP needs hashes/nonces verified against the built bundle (docs/deployment.md).
